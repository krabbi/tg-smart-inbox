[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-smart-inbox"
version = "0.1.0"
description = "A Telegram bot that turns your saved messages chaos into organized, actionable knowledge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7",
    "anthropic>=0.25",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "groq>=0.9",
    "openai>=1.0",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.125",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "apscheduler>=3.10",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pgvector>=0.2",
    "fastapi>=0.111",
    "PyJWT>=2.8",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20",
    "watchfiles>=0.21",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["bot*", "web*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".understand-anything"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["bot", "web"]
omit = ["bot/__main__.py"]

[tool.coverage.report]
fail_under = 80
