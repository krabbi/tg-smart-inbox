name: Deploy

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run ruff
        run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: inbox
          POSTGRES_USER: inbox
          POSTGRES_PASSWORD: inbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inbox -d inbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://inbox:inbox@localhost:5432/inbox
      TELEGRAM_BOT_TOKEN: "1234567890:AAFakeTokenForTestingPurposesOnly"
      ANTHROPIC_API_KEY: "sk-ant-fake-key-for-ci"
      ALLOWED_USER_IDS: "123456789"
      VOYAGE_API_KEY: ""
      GROQ_API_KEY: ""
      GOOGLE_DRIVE_CREDENTIALS_FILE: "credentials.json"
      GOOGLE_DRIVE_FOLDER_ID: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run pytest
        run: pytest --tb=short

  build-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: base
          push: true
          tags: ghcr.io/krabbi/tg-smart-inbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
