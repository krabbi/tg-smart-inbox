<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tg-smart-inbox</title>
    <style>
      /* --------------------------------------------------------------------- */
      /* Reset & base                                                           */
      /* --------------------------------------------------------------------- */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f5f5f5;
        color: #333;
        height: 100vh;
        overflow: hidden;
      }

      #app {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* --------------------------------------------------------------------- */
      /* Error banner                                                           */
      /* --------------------------------------------------------------------- */
      .error-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #fee2e2;
        color: #991b1b;
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        border-bottom: 1px solid #fca5a5;
        flex-shrink: 0;
      }

      .error-dismiss {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1.2rem;
        color: #991b1b;
        padding: 0 0.25rem;
        line-height: 1;
      }

      /* --------------------------------------------------------------------- */
      /* Authenticated shell: sidebar + content                                */
      /* --------------------------------------------------------------------- */
      .app-shell {
        display: flex;
        height: 100%;
        flex: 1;
        min-height: 0;
      }

      .sidebar {
        width: 200px;
        flex-shrink: 0;
        background: #1e293b;
        color: #f1f5f9;
        display: flex;
        flex-direction: column;
        padding: 1rem 0;
      }

      .sidebar-brand {
        font-size: 1rem;
        font-weight: 600;
        padding: 0 1rem 1rem;
        border-bottom: 1px solid #334155;
        margin-bottom: 0.5rem;
        color: #e2e8f0;
      }

      .sidebar-tabs {
        display: flex;
        flex-direction: column;
        gap: 0.125rem;
        padding: 0 0.5rem;
      }

      .tab {
        background: none;
        border: none;
        cursor: pointer;
        text-align: left;
        padding: 0.5rem 0.75rem;
        border-radius: 0.375rem;
        font-size: 0.9rem;
        color: #94a3b8;
        transition: background 0.15s, color 0.15s;
      }

      .tab:hover {
        background: #334155;
        color: #f1f5f9;
      }

      .tab--active {
        background: #3b82f6;
        color: #ffffff;
      }

      .tab--active:hover {
        background: #2563eb;
      }

      .content-area {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
        background: #f8fafc;
      }

      .content-placeholder {
        color: #94a3b8;
        font-size: 0.9rem;
        margin: 0;
      }

      /* --------------------------------------------------------------------- */
      /* Unauthenticated: login placeholder                                    */
      /* --------------------------------------------------------------------- */
      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .login-placeholder {
        text-align: center;
        padding: 2rem 3rem;
        background: #ffffff;
        border-radius: 0.75rem;
        box-shadow: 0 1px 8px rgba(0, 0, 0, 0.08);
      }

      .login-placeholder h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        color: #1e293b;
      }

      .login-placeholder p {
        margin: 0 0 1.25rem;
        color: #64748b;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div id="app">loading&hellip;</div>
    <script type="module" src="/src/Main.ts"></script>
  </body>
</html>
