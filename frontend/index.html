<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tg-smart-inbox</title>
    <style>
      /* --------------------------------------------------------------------- */
      /* Reset & base                                                           */
      /* --------------------------------------------------------------------- */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f5f5f5;
        color: #333;
        height: 100vh;
        overflow: hidden;
      }

      #app {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* --------------------------------------------------------------------- */
      /* Error banner                                                           */
      /* --------------------------------------------------------------------- */
      .error-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #fee2e2;
        color: #991b1b;
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
        border-bottom: 1px solid #fca5a5;
        flex-shrink: 0;
      }

      .error-dismiss {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1.2rem;
        color: #991b1b;
        padding: 0 0.25rem;
        line-height: 1;
      }

      /* --------------------------------------------------------------------- */
      /* Authenticated shell: sidebar + content                                */
      /* --------------------------------------------------------------------- */
      .app-shell {
        display: flex;
        height: 100%;
        flex: 1;
        min-height: 0;
      }

      .sidebar {
        width: 200px;
        flex-shrink: 0;
        background: #1e293b;
        color: #f1f5f9;
        display: flex;
        flex-direction: column;
        padding: 1rem 0;
      }

      .sidebar-brand {
        font-size: 1rem;
        font-weight: 600;
        padding: 0 1rem 1rem;
        border-bottom: 1px solid #334155;
        margin-bottom: 0.5rem;
        color: #e2e8f0;
      }

      .sidebar-tabs {
        display: flex;
        flex-direction: column;
        gap: 0.125rem;
        padding: 0 0.5rem;
      }

      .tab {
        background: none;
        border: none;
        cursor: pointer;
        text-align: left;
        padding: 0.5rem 0.75rem;
        border-radius: 0.375rem;
        font-size: 0.9rem;
        color: #94a3b8;
        transition: background 0.15s, color 0.15s;
      }

      .tab:hover {
        background: #334155;
        color: #f1f5f9;
      }

      .tab--active {
        background: #3b82f6;
        color: #ffffff;
      }

      .tab--active:hover {
        background: #2563eb;
      }

      .content-area {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
        background: #f8fafc;
      }

      .content-placeholder {
        color: #94a3b8;
        font-size: 0.9rem;
        margin: 0;
      }

      /* --------------------------------------------------------------------- */
      /* Unauthenticated: login card + Telegram widget                        */
      /* --------------------------------------------------------------------- */
      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .login-card {
        text-align: center;
        padding: 2rem 3rem;
        background: #ffffff;
        border-radius: 0.75rem;
        box-shadow: 0 1px 8px rgba(0, 0, 0, 0.08);
        min-width: 280px;
      }

      .login-title {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        color: #1e293b;
      }

      .login-subtitle {
        margin: 0 0 1.25rem;
        color: #64748b;
        font-size: 0.95rem;
      }

      .login-loading {
        margin: 0 0 1rem;
        color: #3b82f6;
        font-size: 0.9rem;
      }

      #telegram-login-widget {
        display: flex;
        justify-content: center;
        min-height: 40px;
      }

      /* --------------------------------------------------------------------- */
      /* Type badges                                                            */
      /* --------------------------------------------------------------------- */
      .type-badge {
        display: inline-block;
        padding: 0.15rem 0.5rem;
        border-radius: 0.25rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .type-badge--task   { background: #dbeafe; color: #1d4ed8; }
      .type-badge--note   { background: #f0fdf4; color: #166534; }
      .type-badge--link   { background: #fef9c3; color: #854d0e; }
      .type-badge--idea   { background: #faf5ff; color: #6b21a8; }
      .type-badge--media  { background: #fce7f3; color: #9d174d; }

      /* --------------------------------------------------------------------- */
      /* Item list view                                                         */
      /* --------------------------------------------------------------------- */
      .item-list-view {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        height: 100%;
      }

      /* Search bar */
      .search-bar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .search-input {
        flex: 1;
        min-width: 160px;
        padding: 0.4rem 0.75rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.375rem;
        font-size: 0.9rem;
        background: #fff;
        color: #1e293b;
        outline: none;
        transition: border-color 0.15s;
      }

      .search-input:focus {
        border-color: #3b82f6;
      }

      /* Buttons */
      .btn {
        padding: 0.4rem 0.9rem;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        border: none;
        transition: background 0.15s, color 0.15s;
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .btn-primary {
        background: #3b82f6;
        color: #fff;
      }

      .btn-primary:hover:not(:disabled) {
        background: #2563eb;
      }

      .btn-secondary {
        background: #e2e8f0;
        color: #1e293b;
      }

      .btn-secondary:hover:not(:disabled) {
        background: #cbd5e1;
      }

      .btn-danger {
        background: #ef4444;
        color: #fff;
      }

      .btn-danger:hover:not(:disabled) {
        background: #dc2626;
      }

      .btn-danger-icon {
        background: none;
        border: none;
        cursor: pointer;
        color: #94a3b8;
        font-size: 1rem;
        padding: 0.2rem 0.4rem;
        border-radius: 0.25rem;
        line-height: 1;
        transition: color 0.15s, background 0.15s;
      }

      .btn-danger-icon:hover {
        color: #ef4444;
        background: #fee2e2;
      }

      .btn-icon {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1.1rem;
        line-height: 1;
        padding: 0 0.25rem;
        color: inherit;
      }

      /* Empty / loading states */
      .list-empty-state,
      .list-loading {
        color: #94a3b8;
        font-size: 0.9rem;
        margin: 2rem 0;
        text-align: center;
      }

      /* Item card grid */
      .item-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .item-card {
        display: flex;
        align-items: stretch;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
        overflow: hidden;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      .item-card:hover {
        border-color: #93c5fd;
        box-shadow: 0 1px 4px rgba(59, 130, 246, 0.1);
      }

      .item-card--checked {
        border-color: #3b82f6;
        background: #eff6ff;
      }

      .item-card-checkbox-label {
        display: flex;
        align-items: center;
        padding: 0 0.75rem;
        cursor: pointer;
        flex-shrink: 0;
      }

      .item-card-checkbox {
        width: 1rem;
        height: 1rem;
        cursor: pointer;
        accent-color: #3b82f6;
      }

      .item-card-body {
        flex: 1;
        padding: 0.75rem 0.5rem 0.75rem 0;
        cursor: pointer;
        min-width: 0;
      }

      .item-card-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.35rem;
      }

      .item-card-date {
        font-size: 0.75rem;
        color: #94a3b8;
        margin-left: auto;
      }

      .item-card-title {
        margin: 0 0 0.2rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #1e293b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .item-card-preview {
        margin: 0;
        font-size: 0.8rem;
        color: #64748b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .item-card-delete {
        flex-shrink: 0;
        align-self: center;
        margin-right: 0.5rem;
      }

      /* Bulk delete bar */
      .bulk-delete-bar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 0.75rem;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 0.375rem;
        font-size: 0.875rem;
      }

      .bulk-delete-count {
        color: #1d4ed8;
        font-weight: 500;
      }

      /* Pagination */
      .pagination {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        justify-content: center;
        padding: 0.5rem 0;
      }

      .pagination-info {
        font-size: 0.875rem;
        color: #64748b;
      }

      /* Delete confirmation dialog */
      .dialog-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      .dialog {
        background: #fff;
        border-radius: 0.75rem;
        padding: 1.5rem 2rem;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
        max-width: 400px;
        width: 90%;
        text-align: center;
      }

      .dialog-message {
        margin: 0 0 1.25rem;
        font-size: 1rem;
        color: #1e293b;
      }

      .dialog-actions {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
      }

      /* Feedback banner */
      .feedback-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #f0fdf4;
        color: #166534;
        padding: 0.5rem 0.75rem;
        border-radius: 0.375rem;
        border: 1px solid #86efac;
        font-size: 0.875rem;
      }

      /* --------------------------------------------------------------------- */
      /* Item detail view                                                       */
      /* --------------------------------------------------------------------- */
      .item-detail {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-width: 720px;
      }

      .item-detail-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .item-detail-title {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 700;
        color: #1e293b;
        word-break: break-word;
      }

      .item-detail-meta {
        margin: 0;
        font-size: 0.85rem;
        color: #64748b;
      }

      .item-detail-section {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
        padding: 1rem 1.25rem;
      }

      .item-detail-section-label {
        margin: 0 0 0.5rem;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #94a3b8;
      }

      .item-detail-section-body {
        margin: 0;
        font-size: 0.95rem;
        color: #1e293b;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.6;
      }

      .item-detail-scraped {
        margin: 0;
        font-size: 0.8rem;
        color: #475569;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.5;
        max-height: 300px;
        overflow-y: auto;
        font-family: ui-monospace, monospace;
      }

      .item-detail-loading,
      .item-detail-empty {
        color: #94a3b8;
        font-size: 0.9rem;
        margin: 2rem 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app">loading&hellip;</div>
    <script type="module" src="/src/Main.ts"></script>
  </body>
</html>
