server {
    listen 80;

    # Proxy all /api/* requests to the FastAPI container.
    # Port 8000 is the default WEB_PORT; it is hardcoded here because nginx
    # does not support shell variable expansion in config files by default.
    # If you change WEB_PORT in docker-compose.yml, update this line too.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the Foldkit SPA static files.
    # All non-/api/ routes fall back to index.html (SPA client-side routing).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
