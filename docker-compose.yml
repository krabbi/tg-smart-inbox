services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: inbox
      POSTGRES_USER: inbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbox -d inbox"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production: pulls pre-built image from GHCR, restarts on failure
  bot:
    image: ghcr.io/krabbi/tg-smart-inbox:latest
    environment:
      DATABASE_URL: postgresql+asyncpg://inbox:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db/inbox
      TELEGRAM_BOT_TOKEN:
      ANTHROPIC_API_KEY:
      ALLOWED_USER_IDS:
      VOYAGE_API_KEY:
      GROQ_API_KEY:
      GOOGLE_DRIVE_CREDENTIALS_FILE:
      GOOGLE_DRIVE_TOKEN_FILE:
      GOOGLE_DRIVE_FOLDER_ID:
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Mount Google Drive OAuth files from the host next to docker-compose.yml.
    # credentials.json — OAuth 2.0 client secrets (read-only).
    # token.json — user token persisted between runs (read-write so the Google
    # OAuth library can rewrite it after a refresh).
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
    profiles: [prod]

  # Watchtower: auto-updates the bot when a new image is pushed to GHCR
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: "true"
      REPO_USER: ${GHCR_USER:?GHCR_USER must be set in .env}
      REPO_PASS: ${GHCR_TOKEN:?GHCR_TOKEN must be set in .env}
    profiles: [prod]

  # Development: source mounted as volume, hot-reload via watchfiles
  bot-dev:
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: postgresql+asyncpg://inbox:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db/inbox
      TELEGRAM_BOT_TOKEN:
      ANTHROPIC_API_KEY:
      ALLOWED_USER_IDS:
      VOYAGE_API_KEY:
      GROQ_API_KEY:
      GOOGLE_DRIVE_CREDENTIALS_FILE:
      GOOGLE_DRIVE_TOKEN_FILE:
      GOOGLE_DRIVE_FOLDER_ID:
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./bot:/app/bot
    command: watchfiles --filter python "python -m bot" bot
    profiles: [dev]

  # Web UI companion — FastAPI REST API for the Foldkit SPA.
  # Shares the same PostgreSQL database as the bot.
  # JWT_SECRET is required; the app fails fast at startup if it is not set.
  web:
    build:
      context: .
      target: base
    command: uvicorn web.main:create_app --factory --host 0.0.0.0 --port ${WEB_PORT:-8000}
    environment:
      DATABASE_URL: postgresql+asyncpg://inbox:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db/inbox
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      WEB_PORT: ${WEB_PORT:-8000}
      TELEGRAM_BOT_TOKEN:
      ANTHROPIC_API_KEY:
      ALLOWED_USER_IDS:
      CORS_ORIGINS:
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: [web]

  # nginx reverse proxy: serves the Foldkit SPA and proxies /api/* to the web service.
  # Requires a production frontend build at ./frontend/dist.
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-4000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - web
    restart: unless-stopped
    profiles: [web]

volumes:
  pgdata:
