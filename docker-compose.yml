services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inbox
      POSTGRES_USER: inbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbox -d inbox"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production: code baked into image, restarts on failure
  bot:
    build:
      context: .
      target: base
    env_file: ${BOT_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://inbox:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db/inbox
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: [prod]

  # Development: source mounted as volume, hot-reload via watchfiles
  bot-dev:
    build:
      context: .
      target: dev
    env_file: ${BOT_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://inbox:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db/inbox
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./bot:/app/bot
    command: watchfiles --filter python "python -m bot" bot
    profiles: [dev]

volumes:
  pgdata:
